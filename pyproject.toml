[project]
name = "aseprite-mcp-cli"
version = "0.1.0"
description = "A command-line interface for diivi's Aseprite MCP tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.6.0",
    "pillow>=10.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
aseprite-cli = "aseprite_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aseprite_mcp"]
